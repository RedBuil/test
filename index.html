<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FlowLab 原型设计平台登录页，用于产品原型演示。"
    />
    <title>FlowLab · 登录</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18201c;
        --muted: #6f7872;
        --line: #dce2de;
        --paper: #f4f4ee;
        --white: #ffffff;
        --green: #174f3a;
        --green-hover: #0e3d2b;
        --lime: #c9f15a;
        --danger: #c83d3d;
        --shadow: 0 28px 80px rgba(19, 49, 37, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--paper);
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 12%, rgba(201, 241, 90, 0.24), transparent 25rem),
          radial-gradient(circle at 88% 86%, rgba(23, 79, 58, 0.09), transparent 28rem),
          var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      .page-shell {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
      }

      .login-frame {
        display: grid;
        grid-template-columns: minmax(0, 1.06fr) minmax(420px, 0.94fr);
        width: min(1180px, 100%);
        min-height: min(760px, calc(100vh - 64px));
        overflow: hidden;
        border: 1px solid rgba(23, 79, 58, 0.1);
        border-radius: 28px;
        background: var(--white);
        box-shadow: var(--shadow);
      }

      .brand-panel {
        position: relative;
        display: flex;
        min-height: 100%;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        padding: 46px 48px 42px;
        color: var(--white);
        background: var(--green);
      }

      .brand-panel::before,
      .brand-panel::after {
        position: absolute;
        content: "";
        border-radius: 999px;
        pointer-events: none;
      }

      .brand-panel::before {
        top: 100px;
        right: -165px;
        width: 390px;
        height: 390px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow:
          0 0 0 42px rgba(255, 255, 255, 0.025),
          0 0 0 84px rgba(255, 255, 255, 0.02);
      }

      .brand-panel::after {
        right: 80px;
        bottom: -115px;
        width: 280px;
        height: 280px;
        background: rgba(201, 241, 90, 0.1);
        filter: blur(2px);
      }

      .brand,
      .brand-copy,
      .prototype-card,
      .panel-footer {
        position: relative;
        z-index: 1;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        width: fit-content;
        color: inherit;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 12px;
        color: var(--green);
        background: var(--lime);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
      }

      .brand-mark svg {
        width: 22px;
        height: 22px;
      }

      .brand-name {
        font-size: 20px;
        font-weight: 750;
        letter-spacing: -0.02em;
      }

      .brand-copy {
        max-width: 520px;
        margin-top: 82px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 22px;
        color: var(--lime);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 28px;
        height: 1px;
        content: "";
        background: currentColor;
      }

      .brand-copy h1 {
        max-width: 500px;
        margin: 0;
        font-size: clamp(42px, 4.5vw, 68px);
        font-weight: 650;
        letter-spacing: -0.055em;
        line-height: 1.05;
      }

      .brand-copy h1 span {
        color: var(--lime);
      }

      .brand-copy > p:last-child {
        max-width: 450px;
        margin: 26px 0 0;
        color: rgba(255, 255, 255, 0.68);
        font-size: 16px;
        line-height: 1.8;
      }

      .prototype-card {
        width: min(410px, 84%);
        margin: 48px 0 34px auto;
        padding: 18px;
        transform: rotate(-2deg);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 50px rgba(6, 31, 21, 0.2);
        backdrop-filter: blur(12px);
      }

      .prototype-toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-bottom: 15px;
      }

      .prototype-toolbar i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
      }

      .prototype-toolbar span {
        margin-left: auto;
        color: rgba(255, 255, 255, 0.5);
        font-size: 10px;
        letter-spacing: 0.1em;
      }

      .prototype-body {
        display: grid;
        grid-template-columns: 74px 1fr;
        gap: 10px;
        min-height: 132px;
      }

      .prototype-nav,
      .prototype-canvas {
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.1);
      }

      .prototype-nav {
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding: 12px 10px;
      }

      .prototype-nav i,
      .prototype-line {
        display: block;
        height: 5px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.25);
      }

      .prototype-nav i:first-child {
        width: 85%;
        background: var(--lime);
      }

      .prototype-nav i:nth-child(2) {
        width: 62%;
      }

      .prototype-nav i:nth-child(3) {
        width: 74%;
      }

      .prototype-canvas {
        padding: 14px;
      }

      .prototype-line {
        width: 44%;
      }

      .prototype-line.short {
        width: 28%;
        margin-top: 7px;
        opacity: 0.58;
      }

      .prototype-widgets {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 8px;
        margin-top: 18px;
      }

      .prototype-widgets i {
        height: 60px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.11);
      }

      .prototype-widgets i:first-child {
        background: rgba(201, 241, 90, 0.28);
      }

      .panel-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
      }

      .team-avatars {
        display: flex;
        align-items: center;
      }

      .team-avatars span {
        display: grid;
        width: 28px;
        height: 28px;
        margin-left: -7px;
        place-items: center;
        border: 2px solid var(--green);
        border-radius: 50%;
        color: var(--green);
        background: var(--lime);
        font-size: 9px;
        font-weight: 800;
      }

      .team-avatars span:first-child {
        margin-left: 0;
      }

      .form-panel {
        display: flex;
        min-width: 0;
        flex-direction: column;
        padding: 42px clamp(44px, 6vw, 86px);
      }

      .form-topbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        min-height: 38px;
        gap: 9px;
        color: var(--muted);
        font-size: 13px;
      }

      .text-link {
        color: var(--green);
        font-weight: 700;
        text-decoration: none;
      }

      .text-link:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .form-wrap {
        display: flex;
        width: min(100%, 420px);
        flex: 1;
        flex-direction: column;
        justify-content: center;
        margin: 0 auto;
        padding: 46px 0 30px;
      }

      .form-heading {
        margin-bottom: 34px;
      }

      .form-heading .mobile-brand {
        display: none;
      }

      .form-heading h2 {
        margin: 0;
        font-size: clamp(32px, 3vw, 42px);
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .form-heading p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .demo-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 18px;
        padding: 7px 10px;
        border-radius: 999px;
        color: var(--green);
        background: #eff6e2;
        font-size: 12px;
        font-weight: 650;
      }

      .demo-pill::before {
        width: 7px;
        height: 7px;
        content: "";
        border-radius: 50%;
        background: #71a72a;
        box-shadow: 0 0 0 4px rgba(113, 167, 42, 0.12);
      }

      .field {
        margin-bottom: 20px;
      }

      .field-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 9px;
      }

      .field label {
        font-size: 13px;
        font-weight: 700;
      }

      .input-wrap {
        position: relative;
      }

      .input-wrap svg {
        position: absolute;
        top: 50%;
        left: 15px;
        width: 18px;
        height: 18px;
        transform: translateY(-50%);
        color: #8f9992;
        pointer-events: none;
      }

      .input-wrap input {
        width: 100%;
        height: 52px;
        padding: 0 46px;
        border: 1px solid var(--line);
        outline: none;
        border-radius: 12px;
        color: var(--ink);
        background: #fbfcfa;
        transition: border-color 160ms ease, box-shadow 160ms ease,
          background-color 160ms ease;
      }

      .input-wrap input::placeholder {
        color: #a4aca7;
      }

      .input-wrap input:focus {
        border-color: var(--green);
        background: var(--white);
        box-shadow: 0 0 0 4px rgba(23, 79, 58, 0.09);
      }

      .input-wrap.invalid input {
        border-color: var(--danger);
        box-shadow: 0 0 0 4px rgba(200, 61, 61, 0.08);
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 10px;
        display: grid;
        width: 34px;
        height: 34px;
        padding: 0;
        transform: translateY(-50%);
        border: 0;
        border-radius: 8px;
        color: #7b857f;
        background: transparent;
        cursor: pointer;
      }

      .password-toggle:hover {
        color: var(--green);
        background: #edf1ee;
      }

      .password-toggle svg {
        position: static;
        width: 18px;
        height: 18px;
        margin: auto;
        transform: none;
        pointer-events: none;
      }

      .field-error {
        min-height: 18px;
        margin: 6px 2px 0;
        color: var(--danger);
        font-size: 12px;
      }

      .options-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin: -2px 0 24px;
      }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
      }

      .remember input {
        width: 17px;
        height: 17px;
        margin: 0;
        accent-color: var(--green);
      }

      .submit-button {
        position: relative;
        display: flex;
        width: 100%;
        height: 54px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        overflow: hidden;
        border: 0;
        border-radius: 12px;
        color: var(--white);
        background: var(--green);
        box-shadow: 0 12px 24px rgba(23, 79, 58, 0.18);
        cursor: pointer;
        font-weight: 750;
        transition: transform 160ms ease, background-color 160ms ease,
          box-shadow 160ms ease;
      }

      .submit-button::after {
        position: absolute;
        inset: 0;
        content: "";
        transform: translateX(-105%);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.13),
          transparent
        );
        transition: transform 420ms ease;
      }

      .submit-button:hover {
        transform: translateY(-1px);
        background: var(--green-hover);
        box-shadow: 0 15px 28px rgba(23, 79, 58, 0.22);
      }

      .submit-button:hover::after {
        transform: translateX(105%);
      }

      .submit-button:active {
        transform: translateY(0);
      }

      .submit-button:disabled {
        cursor: wait;
        opacity: 0.82;
      }

      .spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: var(--white);
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }

      .submit-button.loading .spinner {
        display: block;
      }

      .submit-button.loading .arrow-icon {
        display: none;
      }

      .arrow-icon {
        width: 18px;
        height: 18px;
        transition: transform 160ms ease;
      }

      .submit-button:hover .arrow-icon {
        transform: translateX(2px);
      }

      .form-footer {
        margin: 26px 0 0;
        color: #939b96;
        font-size: 11px;
        line-height: 1.7;
        text-align: center;
      }

      .form-footer a {
        color: #657069;
      }

      .toast {
        position: fixed;
        top: 22px;
        left: 50%;
        z-index: 20;
        display: flex;
        max-width: calc(100vw - 32px);
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        transform: translate(-50%, -24px);
        border: 1px solid rgba(23, 79, 58, 0.14);
        border-radius: 12px;
        color: var(--green);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 16px 42px rgba(23, 79, 58, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease, transform 220ms ease;
        backdrop-filter: blur(12px);
        font-size: 13px;
        font-weight: 650;
      }

      .toast.visible {
        transform: translate(-50%, 0);
        opacity: 1;
      }

      .toast-icon {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 50%;
        color: var(--white);
        background: var(--green);
        font-size: 12px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 900px) {
        .page-shell {
          padding: 20px;
        }

        .login-frame {
          grid-template-columns: minmax(300px, 0.8fr) minmax(390px, 1.2fr);
          min-height: calc(100vh - 40px);
        }

        .brand-panel {
          padding: 36px 30px;
        }

        .brand-copy {
          margin-top: 74px;
        }

        .brand-copy h1 {
          font-size: 44px;
        }

        .prototype-card {
          width: 100%;
        }

        .form-panel {
          padding-right: 42px;
          padding-left: 42px;
        }
      }

      @media (max-width: 720px) {
        body {
          background: var(--white);
        }

        .page-shell {
          display: block;
          padding: 0;
        }

        .login-frame {
          display: block;
          min-height: 100vh;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        .brand-panel {
          display: none;
        }

        .form-panel {
          min-height: 100vh;
          padding: 24px clamp(22px, 7vw, 52px) 30px;
        }

        .form-topbar {
          min-height: auto;
        }

        .form-wrap {
          justify-content: flex-start;
          padding-top: clamp(56px, 12vh, 100px);
        }

        .form-heading .mobile-brand {
          display: inline-flex;
          margin-bottom: 38px;
          color: var(--green);
        }

        .form-heading .mobile-brand .brand-mark {
          color: var(--green);
        }

        .form-heading h2 {
          font-size: 34px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="login-frame" aria-label="FlowLab 登录页面">
        <aside class="brand-panel">
          <a class="brand" href="#" aria-label="FlowLab 首页">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M6 5.5h7.2a4.8 4.8 0 1 1 0 9.6H9.8V19H6V5.5Z"
                  fill="currentColor"
                />
                <circle cx="13.2" cy="10.3" r="1.8" fill="#c9f15a" />
              </svg>
            </span>
            <span class="brand-name">FlowLab</span>
          </a>

          <div class="brand-copy">
            <p class="eyebrow">Product Design Workspace</p>
            <h1>让每个想法，<br />更快成为<span>产品。</span></h1>
            <p>
              从第一张草图到可交互原型，在同一个空间里完成设计、协作与验证。
            </p>
          </div>

          <div class="prototype-card" aria-hidden="true">
            <div class="prototype-toolbar">
              <i></i><i></i><i></i><span>PROTOTYPE / 01</span>
            </div>
            <div class="prototype-body">
              <div class="prototype-nav"><i></i><i></i><i></i></div>
              <div class="prototype-canvas">
                <i class="prototype-line"></i>
                <i class="prototype-line short"></i>
                <div class="prototype-widgets"><i></i><i></i></div>
              </div>
            </div>
          </div>

          <div class="panel-footer">
            <div class="team-avatars" aria-hidden="true">
              <span>YM</span><span>CH</span><span>LN</span><span>+8</span>
            </div>
            <span>已有 12,000+ 产品团队加入</span>
          </div>
        </aside>

        <div class="form-panel">
          <div class="form-topbar">
            <span>还没有账号？</span>
            <a class="text-link" href="#" data-demo-link>免费注册</a>
          </div>

          <div class="form-wrap">
            <header class="form-heading">
              <a class="brand mobile-brand" href="#" aria-label="FlowLab 首页">
                <span class="brand-mark" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path
                      d="M6 5.5h7.2a4.8 4.8 0 1 1 0 9.6H9.8V19H6V5.5Z"
                      fill="currentColor"
                    />
                    <circle cx="13.2" cy="10.3" r="1.8" fill="#c9f15a" />
                  </svg>
                </span>
                <span class="brand-name">FlowLab</span>
              </a>
              <h2>欢迎回来</h2>
              <p>登录你的工作空间，继续完成上次的灵感。</p>
              <span class="demo-pill">当前为可交互演示原型</span>
            </header>

            <form id="loginForm" novalidate>
              <div class="field">
                <div class="field-row">
                  <label for="account">邮箱或手机号</label>
                </div>
                <div class="input-wrap" id="accountWrap">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M4 6.8A1.8 1.8 0 0 1 5.8 5h12.4A1.8 1.8 0 0 1 20 6.8v10.4a1.8 1.8 0 0 1-1.8 1.8H5.8A1.8 1.8 0 0 1 4 17.2V6.8Z"
                      stroke="currentColor"
                      stroke-width="1.7"
                    />
                    <path
                      d="m5 7 7 5 7-5"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                  <input
                    id="account"
                    name="account"
                    type="text"
                    inputmode="email"
                    autocomplete="username"
                    placeholder="name@example.com"
                    aria-describedby="accountError"
                  />
                </div>
                <p class="field-error" id="accountError" role="alert"></p>
              </div>

              <div class="field">
                <div class="field-row">
                  <label for="password">密码</label>
                  <a class="text-link" href="#" data-demo-link>忘记密码？</a>
                </div>
                <div class="input-wrap" id="passwordWrap">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect
                      x="5"
                      y="10"
                      width="14"
                      height="10"
                      rx="2"
                      stroke="currentColor"
                      stroke-width="1.7"
                    />
                    <path
                      d="M8 10V7.5a4 4 0 0 1 8 0V10"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                    />
                    <path
                      d="M12 14v2"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                    />
                  </svg>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="请输入至少 6 位密码"
                    aria-describedby="passwordError"
                  />
                  <button
                    class="password-toggle"
                    id="passwordToggle"
                    type="button"
                    aria-label="显示密码"
                    aria-pressed="false"
                  >
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path
                        d="M2.8 12s3.3-5.3 9.2-5.3S21.2 12 21.2 12s-3.3 5.3-9.2 5.3S2.8 12 2.8 12Z"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linejoin="round"
                      />
                      <circle
                        cx="12"
                        cy="12"
                        r="2.3"
                        stroke="currentColor"
                        stroke-width="1.7"
                      />
                    </svg>
                  </button>
                </div>
                <p class="field-error" id="passwordError" role="alert"></p>
              </div>

              <div class="options-row">
                <label class="remember">
                  <input type="checkbox" name="remember" checked />
                  <span>保持登录状态</span>
                </label>
                <span></span>
              </div>

              <button class="submit-button" id="submitButton" type="submit">
                <span class="spinner" aria-hidden="true"></span>
                <span class="button-label">登录工作台</span>
                <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M5 12h14m-5-5 5 5-5 5"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </form>

            <p class="form-footer">
              登录即表示你同意 FlowLab 的
              <a href="#" data-demo-link>服务条款</a> 与
              <a href="#" data-demo-link>隐私政策</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <span class="toast-icon">✓</span>
      <span id="toastText">操作成功</span>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");
      const accountInput = document.getElementById("account");
      const passwordInput = document.getElementById("password");
      const accountWrap = document.getElementById("accountWrap");
      const passwordWrap = document.getElementById("passwordWrap");
      const accountError = document.getElementById("accountError");
      const passwordError = document.getElementById("passwordError");
      const passwordToggle = document.getElementById("passwordToggle");
      const submitButton = document.getElementById("submitButton");
      const toast = document.getElementById("toast");
      const toastText = document.getElementById("toastText");
      let toastTimer;

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toastText.textContent = message;
        toast.classList.add("visible");
        toastTimer = window.setTimeout(() => toast.classList.remove("visible"), 2600);
      }

      function setFieldState(wrap, errorElement, message) {
        wrap.classList.toggle("invalid", Boolean(message));
        errorElement.textContent = message;
      }

      function validateForm() {
        const account = accountInput.value.trim();
        const password = passwordInput.value;
        let isValid = true;

        if (!account) {
          setFieldState(accountWrap, accountError, "请输入邮箱或手机号");
          isValid = false;
        } else {
          setFieldState(accountWrap, accountError, "");
        }

        if (!password) {
          setFieldState(passwordWrap, passwordError, "请输入密码");
          isValid = false;
        } else if (password.length < 6) {
          setFieldState(passwordWrap, passwordError, "密码至少需要 6 位字符");
          isValid = false;
        } else {
          setFieldState(passwordWrap, passwordError, "");
        }

        return isValid;
      }

      accountInput.addEventListener("input", () => {
        if (accountInput.value.trim()) {
          setFieldState(accountWrap, accountError, "");
        }
      });

      passwordInput.addEventListener("input", () => {
        if (passwordInput.value.length >= 6) {
          setFieldState(passwordWrap, passwordError, "");
        }
      });

      passwordToggle.addEventListener("click", () => {
        const isVisible = passwordInput.type === "text";
        passwordInput.type = isVisible ? "password" : "text";
        passwordToggle.setAttribute("aria-pressed", String(!isVisible));
        passwordToggle.setAttribute("aria-label", isVisible ? "显示密码" : "隐藏密码");
        passwordInput.focus();
      });

      loginForm.addEventListener("submit", (event) => {
        event.preventDefault();

        if (!validateForm()) {
          (accountError.textContent ? accountInput : passwordInput).focus();
          return;
        }

        submitButton.disabled = true;
        submitButton.classList.add("loading");
        submitButton.querySelector(".button-label").textContent = "正在进入工作台";

        window.setTimeout(() => {
          submitButton.disabled = false;
          submitButton.classList.remove("loading");
          submitButton.querySelector(".button-label").textContent = "登录工作台";
          showToast("登录成功，这是原型演示页面");
        }, 900);
      });

      document.querySelectorAll("[data-demo-link]").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          showToast("该功能将在正式版本中开放");
        });
      });
    </script>
  </body>
</html>
