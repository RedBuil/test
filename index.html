<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>供赢直达 V3.4｜批量标注</title><style>:root{--r:#f04444}*{box-sizing:border-box}body{margin:0;background:#e9edf2;font-family:"Microsoft YaHei",Arial}.stage{width:min(100%,430px);height:100vh;margin:auto;position:relative;overflow:hidden;background:#fff;box-shadow:0 0 40px #26303b24}iframe{width:100%;height:100%;border:0}.overlay{position:absolute;inset:0;z-index:10;display:none;cursor:crosshair}.overlay.on{display:block}.region{position:absolute;border:2px solid var(--r);background:#f0444416;border-radius:4px;pointer-events:auto;cursor:pointer}.region.sel{border-color:#196ee6;background:#196ee61a}.region:after{content:attr(data-label);position:absolute;left:-2px;top:-25px;background:var(--r);color:#fff;border-radius:5px 5px 5px 0;padding:3px 7px;white-space:nowrap;font-size:12px}.region.sel:after{background:#196ee6}.draft{position:absolute;border:2px dashed var(--r);background:#f0444414}.pen{position:fixed;z-index:20;right:max(18px,calc((100vw - 430px)/2 + 18px));bottom:28px;background:var(--r);color:#fff;border:0;border-radius:28px;padding:14px 18px;font:inherit;font-weight:bold;box-shadow:0 7px 18px #f0444470;cursor:pointer}.pen.active{background:#20242b}.bar{display:none;position:fixed;z-index:21;right:max(18px,calc((100vw - 430px)/2 + 18px));bottom:86px;gap:8px}.bar.show{display:flex}.bar button,.drawer button{border:0;border-radius:18px;padding:9px 12px;background:#fff;box-shadow:0 3px 12px #1112;font:inherit}.drawer{display:none;position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);max-height:65vh;padding:18px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -5px 24px #1112;overflow:auto}.drawer.show{display:block}.drawer h2{font-size:18px;margin:0}.drawer p{font-size:13px;color:#777;line-height:1.6}.item{border:1px solid #efe3e3;border-radius:10px;padding:10px;margin:9px 0}.item b{font-size:14px}.item textarea{width:100%;height:52px;margin-top:7px;padding:7px;border:1px solid #e5e8ec;border-radius:7px;font:inherit;font-size:13px}.item button{box-shadow:none;background:#fff0ef;color:var(--r);padding:5px 8px;margin:6px 4px 0 0}.primary{background:var(--r)!important;color:#fff!important}.dialog{display:none;position:fixed;z-index:40;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px}.dialog.show{display:flex}.dialog .box{width:min(100%,380px);background:#fff;border-radius:16px;padding:20px}.dialog input,.dialog textarea{width:100%;padding:10px;margin:7px 0;border:1px solid #e5e8ec;border-radius:8px;font:inherit}.dialog textarea{height:70px}.dialog button{border:0;border-radius:8px;padding:10px 14px;margin-right:8px;font-weight:bold}.toast{display:none;position:fixed;z-index:50;top:48%;left:50%;transform:translate(-50%,-50%);background:#222d;color:#fff;padding:12px 16px;border-radius:8px;font-size:14px}.toast.show{display:block}</style><body><main class="stage" id="stage"><iframe id="prototype" src="供赢直达小程序_V3.2.html" title="供赢直达小程序"></iframe><div class="overlay" id="overlay"></div></main><div class="bar" id="bar"><button onclick="openList()">多选标注清单</button><button onclick="selectAll()">全选</button></div><button class="pen" id="pen" onclick="togglePen()">✎ 批量标注笔</button><aside class="drawer" id="drawer"><h2>多选标注与修改备注</h2><p>勾选要同步修改的区域；每条备注会跟随对应编号导出。</p><div id="list"></div><button class="primary" onclick="exportSelected()">复制选中区域的同步修改指令</button><button onclick="closeList()">关闭</button></aside><div class="dialog" id="dialog"><div class="box"><h2 style="margin:0">新增标注</h2><input id="name" placeholder="区域名称，例如：首页品牌区"><textarea id="note" placeholder="本区域的具体修改备注"></textarea><button class="primary" onclick="save()">保存并继续标注</button><button onclick="cancel()">取消</button></div></div><div class="toast" id="toast"></div><script>
const overlay=document.getElementById('overlay'),pen=document.getElementById('pen'),bar=document.getElementById('bar');let regions=JSON.parse(localStorage.getItem('gyzd-v34-batch')||'[]'),drawing=false,start,draft,pending;
function persist(){localStorage.setItem('gyzd-v34-batch',JSON.stringify(regions))}function render(){overlay.querySelectorAll('.region').forEach(x=>x.remove());regions.forEach((region,index)=>{let element=document.createElement('i');element.className='region'+(region.selected?' sel':'');element.dataset.label='#'+(index+1)+' '+region.name;element.style.cssText=`left:${region.x}px;top:${region.y}px;width:${region.w}px;height:${region.h}px`;element.onclick=event=>{event.stopPropagation();region.selected=!region.selected;persist();render()};overlay.appendChild(element)})}
function togglePen(){let active=!overlay.classList.contains('on');overlay.classList.toggle('on',active);pen.classList.toggle('active',active);pen.textContent=active?'完成批量标注':'✎ 批量标注笔';bar.classList.toggle('show',active);document.getElementById('prototype').style.pointerEvents=active?'none':'auto';if(active)toast('可连续拖拽添加多个框选区域')}
overlay.onpointerdown=event=>{if(event.target!==overlay)return;let rect=overlay.getBoundingClientRect();drawing=true;start={x:event.clientX-rect.left,y:event.clientY-rect.top};draft=document.createElement('i');draft.className='draft';overlay.appendChild(draft);overlay.setPointerCapture(event.pointerId)};overlay.onpointermove=event=>{if(!drawing)return;let rect=overlay.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top,left=Math.min(start.x,x),top=Math.min(start.y,y),w=Math.abs(x-start.x),h=Math.abs(y-start.y);draft.style.cssText=`left:${left}px;top:${top}px;width:${w}px;height:${h}px`};overlay.onpointerup=event=>{if(!drawing)return;drawing=false;let rect=overlay.getBoundingClientRect(),end={x:event.clientX-rect.left,y:event.clientY-rect.top};draft.remove();if(Math.abs(end.x-start.x)<18||Math.abs(end.y-start.y)<18)return;pending={x:Math.round(Math.min(start.x,end.x)),y:Math.round(Math.min(start.y,end.y)),w:Math.round(Math.abs(end.x-start.x)),h:Math.round(Math.abs(end.y-start.y))};document.getElementById('name').value='';document.getElementById('note').value='';document.getElementById('dialog').classList.add('show')};
function save(){regions.push({...pending,name:document.getElementById('name').value.trim()||'待修改区域',note:document.getElementById('note').value.trim(),selected:true});persist();render();document.getElementById('dialog').classList.remove('show');toast('已保存，可继续添加下一条标注')}function cancel(){document.getElementById('dialog').classList.remove('show')}function openList(){drawList();document.getElementById('drawer').classList.add('show')}function closeList(){document.getElementById('drawer').classList.remove('show')}function drawList(){let list=document.getElementById('list');list.innerHTML=regions.length?regions.map((region,index)=>`<div class="item"><label><input type="checkbox" ${region.selected?'checked':''} onchange="toggle(${index},this.checked)"> <b>#${index+1} ${region.name}</b></label><textarea onchange="note(${index},this.value)" placeholder="填写本区域修改备注">${region.note||''}</textarea><button onclick="del(${index})">删除标注</button></div>`).join(''):'<p>尚未添加标注。开启标注笔后可连续框选多个区域。</p>'}function toggle(index,value){regions[index].selected=value;persist();render()}function note(index,value){regions[index].note=value;persist();render()}function del(index){regions.splice(index,1);persist();render();drawList()}function selectAll(){regions.forEach(x=>x.selected=true);persist();render();toast('已全选标注区域')}function exportSelected(){let selected=regions.filter(x=>x.selected);if(!selected.length){toast('请至少勾选一个区域');return}let text='请仅同步修改以下已标注区域：\n'+selected.map(region=>{let n=regions.indexOf(region)+1;return `#${n}【${region.name}】\n修改备注：${region.note||'请根据区域内容优化'}\n框选位置：(${region.x},${region.y})，尺寸：${region.w}×${region.h}`}).join('\n\n');navigator.clipboard?.writeText(text);toast('已复制同步修改指令，请直接发送给我')}function toast(message){let item=document.getElementById('toast');item.textContent=message;item.classList.add('show');setTimeout(()=>item.classList.remove('show'),1800)}render();
</script></body></html>
